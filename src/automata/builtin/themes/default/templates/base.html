<!DOCTYPE html>
<html lang="en">
<head data-automata-theme="default">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>${ website_config.theme.config.short_title }</title>
    <link href="${ url_for('static/style.css') }" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    {% include 'parts/head-custom.html' with context %}
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100">

    {% include 'parts/mobile-menu.html' with context %}

    <div class="flex min-h-screen">
        <!-- Left Navigation Column -->
        {% include 'parts/sidebar.html' with context %}

        <!-- Main Content Column -->
        {% block main %}
            ${ content }
        {% endblock %}
    </div>

    <script>
        // Restore saved theme on page load
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
        }

        // Dark mode toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        // Update button to reflect current theme
        function updateThemeButton() {
            const isDark = document.documentElement.classList.contains('dark');
            themeIcon.textContent = isDark ? '☀' : '☾';
            themeText.textContent = isDark ? 'Light' : 'Dark';
        }

        // Initialize button state
        updateThemeButton();

        // Toggle theme on button click
        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.contains('dark');

            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }

            updateThemeButton();
        });

        // Mobile menu toggle
        const menuButton = document.getElementById('mobile-menu-button');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuButton.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });

        // Initialize Lucide icons
        lucide.createIcons();
    </script>

</body>
</html>
