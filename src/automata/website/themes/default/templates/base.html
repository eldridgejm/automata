<!DOCTYPE html>
<html lang="en">
<head data-automata-theme="default">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>${ website_config.theme.config.short_title }</title>
    <link href="${ url_for('static/style.css') }" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    {% include 'parts/head-custom.html' with context %}
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100">

    <!-- Mobile menu button -->
    <div class="mobile-navbar lg:hidden fixed left-0 right-0 bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 z-50">
        <button id="mobile-menu-button" class="py-5 pl-4 text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">
            <i data-lucide="menu" class="w-6 h-5"></i>
        </button>
    </div>

    <!-- Overlay for mobile -->
    <div id="overlay" class="fixed inset-0 bg-black opacity-60 dark:opacity-70 z-30 hidden"></div>


    <div class="flex min-h-screen">
        <!-- Left Navigation Column -->
        {% include 'parts/nav.html' with context %}

        <!-- Main Content Column -->
        {% block main %}
            ${ content }
        {% endblock %}
    </div>

    <script>
        // Restore saved theme on page load
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
        }

        // Dark mode toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        // Update button to reflect current theme
        function updateThemeButton() {
            const isDark = document.documentElement.classList.contains('dark');
            themeIcon.textContent = isDark ? '☀' : '☾';
            themeText.textContent = isDark ? 'Light' : 'Dark';
        }

        // Initialize button state
        updateThemeButton();

        // Toggle theme on button click
        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.contains('dark');

            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }

            updateThemeButton();
        });

        // Mobile menu toggle
        const menuButton = document.getElementById('mobile-menu-button');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuButton.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });

        // Initialize Lucide icons
        lucide.createIcons();
    </script>

</body>
</html>
