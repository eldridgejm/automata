vars:
  course_name: "DSC 40B"
  course_title: "Theoretical Foundations of Data Science II"
  term: "Fall 2025"
  start_date: "2025-09-22"

  date_of_first_lecture: 2025-09-23

  midterm_date: 2025-10-27
  final_date: 2025-12-10

extensions:
  - extensions/practice-problems

materials:
  exams:
    schema:
      required_artifacts:
        - exam.pdf
      optional_artifacts:
        - solution.pdf
      metadata_schema:
        required_keys:
          name: { type: string }
          date: { type: date }
      is_ordered: true
    publications:
      midterm:
        metadata:
          name: "Midterm Exam"
          date: ${ vars.midterm_date }
        artifacts:
          exam.pdf:
            path: exams/midterm/exam.pdf
            release_time:
              __datetime.offset__:
                after: ${ vars.midterm_date }
                by: "3 days"
          solution.pdf:
            path: exams/midterm/solution.pdf
            release_time:
              __datetime.offset__:
                after: ${ vars.midterm_date }
                by: "3 days"
      final:
        metadata:
          name: "Final Exam"
          date: ${ vars.final_date }
        artifacts:
          exam.pdf:
            path: exams/final/exam.pdf
            release_time:
              __datetime.offset__:
                after: ${ vars.final_date }
                by: "3 days"
          solution.pdf:
            path: exams/final/solution.pdf
            release_time:
              __datetime.offset__:
                after: ${ vars.final_date }
                by: "3 days"

website:
  theme:
    use: "default"
    config:
      short_title: ${ vars.course_name }
      long_title: ${ vars.course_title }

      navigation:
          - text: |
              <i data-lucide="home" class="mr-2 text-slate-400"></i>
              Home
            url: index.html

          - text: |
              <i data-lucide="scale" class="mr-2 text-slate-400"></i>
              Syllabus
            url: syllabus.html

          - text: |
              <i data-lucide="pencil" class="mr-2 text-slate-400"></i>
              Practice
            url: practice/week-01.html
  elements:
    schedule:
      __include__: "website/schedule.yaml"
  content_directory: "website/content"
  build_directory: "_build"
  base_path: "."

publish:
  github:
    strategy: gh-pages
    config:
      branch: gh-pages
      remote: origin
