vars:
  course_name: "DSC 40B"
  course_title: "Theoretical Foundations of Data Science II"
  term: "Fall 2025"
  start_date: "2025-09-22"

  date_of_first_lecture: 2025-09-23

  schedule_config:
    __include__: "website/schedule.yaml"

website:
  content_directory: "website/content"
  build_directory: "_build"
  base_path: "."

  theme:
    use: "default"
    config:
      short_title: ${ vars.course_name }
      long_title: ${ vars.course_title }

      navigation:
          - text: |
              <i data-lucide="home" class="mr-2 text-slate-400"></i>
              Home
            url: index.html

          - text: |
              <i data-lucide="scale" class="mr-2 text-slate-400"></i>
              Syllabus
            url: syllabus.html

hooks:
  post_generate_website:
    command: "echo 'Build complete!'"
