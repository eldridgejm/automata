[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automata"
version = "0.1.0"
description = "Automatically generate course webpages from annotated materials."
authors = [
    { name = "Justin Eldridge", email = "jeldridge@ucsd.edu" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml",
    "jinja2",
    "markdown",
    "dictconfig @ git+https://github.com/eldridgejm/dictconfig.git@master",
]

[dependency-groups]
dev = [
    "pytest",
    "sphinx>=8.1.3",
    "sphinxawesome-theme>=5.3.2",
    "ruff",
    "mypy",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/automata"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
