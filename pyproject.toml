[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automata"
version = "0.1.0"
description = "Automatically generate course webpages from annotated materials."
authors = [
    { name = "Justin Eldridge", email = "jeldridge@ucsd.edu" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ruamel.yaml",
    "jinja2",
    "mistune",
    "smartconfig @ git+https://github.com/eldridgejm/smartconfig.git@0.4.0",
    "typer",
]

[project.scripts]
automata = "automata.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "sphinx>=8.1.3",
    "sphinxawesome-theme>=5.3.2",
    "ruff",
    "mypy",
    "pytest-cov>=7.0.0",
    "beautifulsoup4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/automata"]

[project.entry-points."automata.website.themes"]
default = "automata.website.themes.default"

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
markers = [
  "integration: tests that hit external systems (db, network, etc.)",
]
addopts = "-m 'not integration'"
